# Place at: .github/workflows/3d-contrib.yml
# Generates a 3D contribution globe — renders as profile-night-green.svg

name: Generate 3D Contribution Globe

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: |
            {
              "githubUserName": "sxddhxrthg",
              "backgroundColor": "#0d1117",
              "foregroundColor": "#00ff41",
              "contributionColorArray": ["#0d1117","#0e4429","#006d32","#26a641","#39d353"],
              "angle": 20,
              "type": "normal"
            }

      - name: Push to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "Update 3D contribution graph" || echo "No changes"
          git push
